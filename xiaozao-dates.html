          <div
            class="xz-book"
            id="xz-book"
            data-pages='[{"h": "../xiaozao/entry-2026-10-21-minsu-0954.html", "t": "七夕乞巧", "k": "minsu", "z": "民俗", "d": "十月廿一日 · 上午", "x": "「七月七日，为牵牛织女聚会之夜。是夕，人家妇女结彩缕，穿七孔针，或以金银𨱎石为针，陈几筵酒脯瓜果于庭中，以乞巧，有喜子网于瓜上，则以为符应。」", "n": "第一则"}, {"h": "../xiaozao/entry-2026-10-21-shenhua-0954.html", "t": "夸父逐日", "k": "shenhua", "z": "神话", "d": "十月廿一日 · 上午", "x": "「夸父与日逐走，入日。渴，欲得饮，饮于河、渭，河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。」", "n": "第二则"}, {"h": "../xiaozao/entry-2026-10-21-zhiguai-0954.html", "t": "谈生", "k": "zhiguai", "z": "志怪", "d": "十月廿一日 · 上午", "x": "「汉，谈生者，年四十，无妇，常感激读诗经，夜半，有女子，年可十五六，姿颜服饰，天下无双，来就生为夫妇之言，曰：『我与人不同，勿以火照我也，三年之后，方可照耳。』与为夫妇，生一儿，已二岁，不能忍，夜，伺其寝后，盗照视之。其腰已上生肉，如人，腰已下，但有枯骨。妇觉，遂言曰：『君负我。…", "n": "第三则"}, {"h": "../xiaozao/history-2026-10-21-history-jiaxu-03.html", "t": "贾诩", "k": "history", "z": "历史", "d": "十月廿一日", "x": "「文帝即位，以诩为太尉，进爵魏寿乡侯，增邑三百，并前八百户。又分邑二百，封小子访为列侯。以长子穆为驸马都尉。」", "n": "第四则"}, {"h": "../xiaozao/entry-2026-10-21-minsu-1454.html", "t": "端午先叫浴兰节", "k": "minsu", "z": "民俗", "d": "十月廿一日 · 午间", "x": "「五月五日，谓之浴兰节。四民并蹋百草之戏，采艾以为人，悬门户上，以禳毒气。以菖蒲或镂或屑以泛酒。」", "n": "第五则"}, {"h": "../xiaozao/entry-2026-10-21-shenhua-1454.html", "t": "共工怒触不周山", "k": "shenhua", "z": "神话", "d": "十月廿一日 · 午间", "x": "「昔者共工与颛顼争为帝，怒而触不周之山。天柱折，地维绝。天倾西北，故日月星辰移焉；地不满东南，故水潦尘埃归焉。」", "n": "第六则"}, {"h": "../xiaozao/entry-2026-10-21-zhiguai-1454.html", "t": "西门亭", "k": "zhiguai", "z": "志怪", "d": "十月廿一日 · 午间", "x": "「后汉时，汝南汝阳西门亭，有鬼魅，宾客止宿，辄有死亡。其厉，厌者皆亡髮，失精。寻问其故，云：『先时颇已有怪物。其后，郡侍奉掾宜禄郑奇来，去亭六七里，有一端正妇人乞寄载，奇初难之，然后上车，入亭，趋至楼下。亭卒白：「楼不可上。」奇云：「吾不恐也。」时亦昏冥，遂上楼，与妇人栖宿。未明…", "n": "第七则"}, {"h": "../xiaozao/entry-2026-10-21-minsu-2054.html", "t": "正月七日为人日", "k": "minsu", "z": "民俗", "d": "十月廿一日 · 晚间", "x": "「正月七日为人日，以七种菜为羹，翦彩为人，或镂金箔为人，以贴屏风，亦戴之以头鬓，亦造华胜以相遗，登高赋诗。」", "n": "第八则"}, {"h": "../xiaozao/entry-2026-10-21-shenhua-2054.html", "t": "姮娥窃药奔月", "k": "shenhua", "z": "神话", "d": "十月廿一日 · 晚间", "x": "「譬若羿请不死之药於西王母，姮娥窃以奔月，怅然有丧，无以续之。」", "n": "第九则"}, {"h": "../xiaozao/entry-2026-10-21-zhiguai-2054.html", "t": "阮瞻", "k": "zhiguai", "z": "志怪", "d": "十月廿一日 · 晚间", "x": "「阮瞻，字千里，素执无鬼论。物莫能难。每自谓，此理足以辨正幽明。忽有客通名诣瞻，寒温毕，聊谈名理。客甚有才辨，瞻与之言，良久，及鬼神之事，反覆甚苦。客遂屈，乃作色曰：『鬼神，古今圣贤所共传，君何得独言无？即仆便是鬼。』于是变为异形，须臾消灭。瞻默然，意色太恶。岁余，病卒。」", "n": "第十则"}, {"h": "../xiaozao/entry-2026-10-20-minsu-0954.html", "t": "冬至为什么要吃赤豆粥", "k": "minsu", "z": "民俗", "d": "十月二十日 · 上午", "x": "「冬至日，作赤豆粥，以禳疫。」", "n": "第十一则"}, {"h": "../xiaozao/entry-2026-10-20-shenhua-0954.html", "t": "女娲补天", "k": "shenhua", "z": "神话", "d": "十月二十日 · 上午", "x": "「往古之时，四极废，九州裂，天不兼覆，地不周载，火爁炎而不灭，水浩洋而不息，猛兽食颛民，鸷鸟攫老弱，于是女娲炼五色石以补苍天，断鳌足以立四极，杀黑龙以济冀州，积芦灰以止淫水。苍天补，四极正，淫水涸，冀州平，狡虫死，颛民生。」", "n": "第十二则"}, {"h": "../xiaozao/entry-2026-10-20-zhiguai-0954.html", "t": "韩凭夫妇", "k": "zhiguai", "z": "志怪", "d": "十月二十日 · 上午", "x": "宋康王舍人韩凭，娶妻何氏，美，康王夺之。凭怨，王囚之，论为城旦。妻密遗凭书，谬其辞曰：「其雨淫淫，河大水深，日出当心。」王得书示左右，左右莫解。臣苏贺对曰：「其雨淫淫，言愁且思也；河大水深，不得往来也；日出当心，心有死志也。」俄而凭乃自杀。其妻乃阴腐其衣。王与之登台，妻遂自投台，…", "n": "第十三则"}, {"h": "../xiaozao/history-2026-10-20-history-jiaxu-02.html", "t": "贾诩", "k": "history", "z": "历史", "d": "十月二十日", "x": "「袁绍围太祖于官渡，太祖粮方尽，问诩计焉出，诩曰：『公明胜绍，勇胜绍，用人胜绍，决机胜绍，有此四胜而半年不定者，但顾万全故也。必决其机，须臾可定也。』太祖曰：『善。』乃并兵出，围击绍三十余里营，破之。绍军大溃，河北平。太祖领冀州牧，徙诩为太中大夫。」", "n": "第十四则"}, {"h": "../xiaozao/entry-2026-10-20-minsu-1454.html", "t": "门神最早是谁", "k": "minsu", "z": "民俗", "d": "十月二十日 · 午间", "x": "「谨按《黄帝书》：上古之时，有荼与郁垒昆弟二人，性能执鬼，度朔山上章桃树下，简阅百鬼，无道理妄为人祸害，荼与郁垒缚以苇索，执以食虎。于是县官常以腊除夕，饰桃人，乘苇茭，画虎于门，皆追效于前事，冀以卫凶也。」（「乘苇茭」他本或作「垂苇茭」。）", "n": "第十五则"}, {"h": "../xiaozao/entry-2026-10-20-shenhua-1454.html", "t": "黄帝战蚩尤", "k": "shenhua", "z": "神话", "d": "十月二十日 · 午间", "x": "「蚩尤作兵伐黄帝，黄帝乃令应龙攻之冀州之野。应龙畜水，蚩尤请风伯雨师，纵大风雨。黄帝乃下天女曰魃，雨止，遂杀蚩尤。魃不得复上，所居不雨。叔均言之帝，后置之赤水之北。叔均乃为田祖。魃时亡之，所欲逐之者，令曰：『神北行！』先除水道，决通沟渎。」", "n": "第十六则"}, {"h": "../xiaozao/entry-2026-10-20-zhiguai-1454.html", "t": "宋大贤", "k": "zhiguai", "z": "志怪", "d": "十月二十日 · 午间", "x": "「南阳西郊有一亭，人不可止，止则有祸。邑人宋大贤以正道自处，尝宿亭楼，夜坐鼓琴，不设兵仗。至夜半时，忽有鬼来登梯，与大贤语，矃目，磋齿，形貌可恶。大贤鼓琴如故。鬼乃去。于市中取死人头来，还语大贤曰：『宁可少睡耶？』因以死人头投大贤前。大贤曰：『甚佳！我暮卧无枕，正欲得此。』鬼复去…", "n": "第十七则"}, {"h": "../xiaozao/entry-2026-10-20-minsu-2054.html", "t": "正旦为什么要爆竹", "k": "minsu", "z": "民俗", "d": "十月二十日 · 晚间", "x": "「正月一日……先于庭前爆竹，以辟山臊恶鬼。」", "n": "第十八则"}, {"h": "../xiaozao/entry-2026-10-20-shenhua-2054.html", "t": "后羿射日", "k": "shenhua", "z": "神话", "d": "十月二十日 · 晚间", "x": "「逮至尧之时，十日并出，焦禾稼，杀草木，而民无所食。猰貐、凿齿、九婴、大风、封豨、修蛇皆为民害。尧乃使羿诛凿齿于畴华之野，杀九婴于凶水之上，缴大风于青丘之泽，上射十日而下杀猰貐，断修蛇于洞庭，禽封豨于桑林。万民皆喜，置尧以为天子。」", "n": "第十九则"}, {"h": "../xiaozao/entry-2026-10-20-zhiguai-2054.html", "t": "秦巨伯", "k": "zhiguai", "z": "志怪", "d": "十月二十日 · 晚间", "x": "「瑯琊秦巨伯，年六十，尝夜行，饮酒，道经蓬山庙，忽见其两孙迎之；扶持百馀步，便捉伯颈着地，骂：「老奴！汝某日捶我，我今当杀汝。」伯思，惟某时信捶此孙。伯乃佯死，乃置伯去。伯归家，欲治两孙，两孙惊惋，叩头言：「为子孙宁可有此？恐是鬼魅，乞更试之。」伯意悟，数日，乃诈醉，行此庙间，复…", "n": "第二十则"}, {"h": "../xiaozao/entry-2026-10-19-zhiguai-0954.html", "t": "鬼有三技", "k": "zhiguai", "z": "志怪", "d": "十月十九日 · 上午", "x": "杭州秀才李某夜行，遇鬼作种种可怖变相。一老者教之：鬼技不过三——能迷人、能遮人、能吓人；识破则技穷。李如法行之，鬼技果尽，仓皇遁去。袁枚借此破「凡异必神」的妄念：吓人靠的是你自己怕，不是它真有通天本事。", "n": "第二十一则"}, {"h": "../xiaozao/entry-2026-10-19-03-minsu.html", "t": "重阳为什么要登高、佩茱萸", "k": "minsu", "z": "民俗", "d": "十月十九日 · 午间", "x": "费长房对桓景说：九月九日你家有大灾，让家人缝绛色布囊、盛茱萸系在臂上，登高饮菊花酒，祸可消。桓景照做，全家登山；傍晚回家，鸡犬牛羊一时暴死。长房说：「此可代也。」", "n": "第二十二则"}, {"h": "../xiaozao/entry-2026-10-19-04-shenhua.html", "t": "精卫填海", "k": "shenhua", "z": "神话", "d": "十月十九日 · 午间", "x": "「发鸠之山，有鸟焉，其状如乌，文首、白喙、赤足，名曰精卫，其鸣自詨。是炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。」", "n": "第二十三则"}, {"h": "../xiaozao/entry-2026-10-19-05-zhiguai.html", "t": "席方平", "k": "zhiguai", "z": "志怪", "d": "十月十九日 · 午间", "x": "陕西东安人席方平，其父席廉与里中羊姓有隙；羊先死，贿买冥吏，笞席父几死。席方平随即赴地下代父伸冤：先告城隍，城隍受羊氏贿，不准；再告郡司，郡司又驳回并杖席；再赴冥王，冥王怒其讼，施火床、锯体——锯至脑，二鬼私语「此孝子」，锯偏左右，使席得不全裂。席不肯屈，冥王无奈，押往转生；席在…", "n": "第二十四则"}, {"h": "../xiaozao/history-2026-10-19-history-jiaxu.html", "t": "贾诩", "k": "history", "z": "历史", "d": "十月十九日", "x": "「贾诩字文和，武威姑臧人也。少时人莫知，唯汉阳阎忠异之，谓诩有良、平之奇。」", "n": "第二十五则"}, {"h": "../xiaozao/entry-2026-10-19-minsu-2054.html", "t": "十月朔为什么叫「秦岁首」", "k": "minsu", "z": "民俗", "d": "十月十九日 · 晚间", "x": "「十月朔日，黍臛，俗谓之秦岁首。」", "n": "第二十六则"}, {"h": "../xiaozao/entry-2026-10-19-shenhua-2054.html", "t": "刑天舞干戚", "k": "shenhua", "z": "神话", "d": "十月十九日 · 晚间", "x": "「刑天与帝争神，帝断其首，葬之常羊之山，乃以乳为目，以脐为口，操干戚以舞。」", "n": "第二十七则"}, {"h": "../xiaozao/entry-2026-10-19-zhiguai-2054.html", "t": "三王墓", "k": "zhiguai", "z": "志怪", "d": "十月十九日 · 晚间", "x": "楚人干将、莫邪为楚王铸剑，三年乃成。剑分雌雄；妻正怀孕。干将知王必怒杀己，嘱妻：若生男，长大后告诉他——「出户，望南山，松生石上，剑在其背。」于是只携雌剑见王。王使相剑：有二，一雄一雌，雌来雄不来，怒而杀干将。", "n": "第二十八则"}, {"h": "../xiaozao/entry-2026-10-18-zhiguai-0954.html", "t": "崂山道士", "k": "zhiguai", "z": "志怪", "d": "十月十八日 · 上午", "x": "邑有王生，少慕道，闻崂山多仙人，往师之。一道士嘱其砍柴服役月余，王苦求授术；道士教以穿墙诀，嘱「归勿妄言，妄言则不验」。王归夸于妻，念咒穿墙演示，头触硬壁，额上坟起如卵，大惭。妻揶揄之。", "n": "第二十九则"}, {"h": "../xiaozao/entry-2026-10-18-zhiguai-1454.html", "t": "画皮", "k": "zhiguai", "z": "志怪", "d": "十月十八日 · 午间", "x": "太原王生早行，遇一女郎自言「金陵下第书生妾，被嫡虐出亡」；生怜而匿诸斋中。途遇道士，道士望气大惊，曰：「子邪气萦绕，何得尚有生望？」生不信。归，窗隙窥之：女解人皮置榻上，执彩笔绘眉目、描花纹；绘已，投笔举皮，如振衣然，披于身，遂复化为美女。生大惧，奔求道士。道士授一蝇拂，嘱挂寝门…", "n": "第三十则"}, {"h": "../xiaozao/entry-2026-10-18-zhiguai-2054.html", "t": "尸变", "k": "zhiguai", "z": "志怪", "d": "十月十八日 · 晚间", "x": "山东阳信县蔡店村，有老翁父子开路边客店。一天黄昏，四个车夫来投宿，客房已满，老翁只好把他们领到停灵的屋子——他儿媳新死，尸体盖着纸被停在帐后，儿子出门买棺木未归。四人倒头便睡，只有一人还迷迷糊糊。忽听灵床「察察」作响，睁眼一看：女尸已揭被起身，面色淡金，额上勒着生绢，走到榻前，对…", "n": "第三十一则"}, {"h": "../xiaozao/entry-2026-10-17-minsu.html", "t": "中元节为什么叫鬼节", "k": "minsu", "z": "民俗", "d": "十月十七日 · 午间", "x": "中元在道教系统里是地官赦罪之日，民间却更常叫「鬼节」：七月半接祖、烧纸、放河灯。", "n": "第三十二则"}, {"h": "../xiaozao/entry-2026-10-17-zhiguai-1454.html", "t": "李寄斩蛇", "k": "zhiguai", "z": "志怪", "d": "十月十七日 · 午间", "x": "东越闽中庸岭有巨蛇，长吏多死；巫祝传蛇要十二三岁童女，官府便用奴婢、罪家女，八月祭送穴口，已吞九女。将乐李诞小女寄应募，父母不许，她偷偷备好剑与咬蛇犬，又用蜜炒的米餈诱蛇出洞，放犬撕咬，自己挥剑数创，蛇涌出而死。她进穴拾出九女骷髅，叹「汝曹怯弱，为蛇所食，甚可哀愍」，缓步而归；越…", "n": "第三十三则"}, {"h": "../xiaozao/entry-2026-10-17-zhiguai-2054.html", "t": "宋定伯捉鬼", "k": "zhiguai", "z": "志怪", "d": "十月十七日 · 晚间", "x": "南阳宋定伯，年少夜行逢鬼。鬼曰：「我是鬼。」定伯诳之：「我亦鬼。」问所欲，皆曰欲至宛市，遂行。鬼嫌步行迟，提议轮流背负；鬼先背定伯，怪其太重，定伯称「新鬼故重」。定伯复背鬼，鬼几乎无重。定伯又问：「新鬼不知有何所畏忌？」鬼答：「惟不喜人唾。」遇水，定伯令鬼先渡，听之无声；己渡则漕…", "n": "第三十四则"}, {"h": "../xiaozao/entry-2026-10-16-shenhua.html", "t": "夸父逐日", "k": "shenhua", "z": "神话", "d": "十月十六日 · 晚间", "x": "夸父与日竞走，入日；渴欲得饮，饮于河渭；河渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。", "n": "第三十五则"}, {"h": "../xiaozao/entry-2026-10-15-minsu.html", "t": "寒食禁火", "k": "minsu", "z": "民俗", "d": "十月十五日 · 午间", "x": "寒食前后禁火冷食，一说纪念介子推，一说源自古代钻燧改火。唐宋以后逐渐并进清明。", "n": "第三十六则"}]'

                  from = lOf(cur),
                  next = cur + chunk * unit;
                var el = document.createElement("div");
                el.className = "xzb-leaf" + (chunk > 1 ? " is-thick" : "");
                el.innerHTML =
                  '<div class="xzb-page xzb-face xzb-front"><div class="xzb-c">' +
                  pg(from) +
                  '</div><i class="xzb-sh"></i></div>' +
                  '<div class="xzb-page xzb-face xzb-back"><div class="xzb-c">' +
                  (single() ? "" : pg(next)) +
                  '</div><i class="xzb-sh"></i></div>';
                book.appendChild(el);
                cur = next;
                set(L, lOf(cur));
                edges();
                var tz = "translateZ(" + (1 + z) + "px) ",
                  o = { duration: dur, easing: EZ, fill: "forwards" };
                var a = el.animate(
                  [
                    { transform: tz + "rotateY(0deg)" },
                    { transform: tz + "rotateY(180deg)" },
                  ],
                  o,
                );
                el.querySelector(".xzb-front .xzb-sh").animate(
                  [
                    { opacity: 0 },
                    { opacity: 0.55, offset: 0.5 },
                    { opacity: 0.55 },
                  ],
                  o,
                );
                el.querySelector(".xzb-back .xzb-sh").animate(
                  [
                    { opacity: 0.55 },
                    { opacity: 0.55, offset: 0.5 },
                    { opacity: 0 },
                  ],
                  o,
                );
                L.querySelector(".xzb-sh").animate(
                  [
                    { opacity: 0.45 },
                    { opacity: 0, offset: 0.55 },
                    { opacity: 0 },
                  ],
                  { duration: dur, easing: EZ },
                );
                R.querySelector(".xzb-sh").animate(
                  [
                    { opacity: 0 },
                    { opacity: 0, offset: 0.5 },
                    { opacity: 0.35, offset: 0.93 },
                    { opacity: 0 },
                  ],
                  { duration: dur, easing: EZ },
                );
                var landed = cur;
                a.finished.then(
                  function () {
                    set(R, landed);
                    el.remove();
                    if (onLand) onLand();
                  },
                  function () {},
                );
              }
              function plan() {
                var unit = single() ? 1 : 2,
                  D = 3 + Math.floor(Math.random() * len),
                  K = Math.max(1, Math.floor(D / unit));
                var F = Math.min(K, 3 + Math.floor(Math.random() * 4)),
                  tail = Math.min(2, F),
                  head = F - tail,
                  hl = K - tail,
                  ch = [];
                for (var i = 0; i < head; i++)
                  ch.push(Math.floor(hl / head) + (i < hl % head ? 1 : 0));
                for (i = 0; i < tail; i++) ch.push(1);
                return { ch: ch, left: unit === 2 && D % 2 === 1 };
              }
              function stop(left) {
                var el = left ? L : R,
                  idx = left ? lOf(cur) : cur;
                if (single()) {
                  el = L;
                  idx = cur;
                }
                var p = at(idx),
                  s = document.createElement("span");
                s.className = "xzb-seal";
                s.textContent = "读此";
                el.appendChild(s);
                say(
                  '停在「<a href="' +
                    esc(p.h) +
                    '">' +
                    esc(p.t) +
                    "</a>」 · " +
                    esc(p.z) +
                    " · " +
                    esc(p.d),
                );
                timer = setTimeout(
                  function () {
                    location.href = p.h;
                  },
                  mqR.matches ? 700 : 1350,
                );
              }
              function flip() {
                if (busy) return;
                busy = 1;
                clearSeal();
                root.classList.add("is-flipping");
                root.setAttribute("aria-busy", "true");
                var pl = plan(),
                  ch = pl.ch,
                  unit = single() ? 1 : 2;
                if (mqR.matches) {
                  for (var j = 0; j < ch.length; j++) cur += ch[j] * unit;
                  render();
                  book.animate([{ opacity: 0.35 }, { opacity: 1 }], {
                    duration: 220,
                  });
                  return stop(pl.left);
                }
                var i = 0;
                (function go() {
                  var c = ch[i],
                    last = i === ch.length - 1,
                    d = i === 0 ? 700 : last ? 1050 : c > 1 ? 470 : 580;
                  turn(
                    c,
                    d,
                    i,
                    last
                      ? function () {
                          stop(pl.left);
                        }
                      : null,
                  );
                  say(
                    (c > 1 ? "一抓 " + c * unit + " 页 · " : "") +
                      "翻至" +
                      esc(at(cur).n),
                  );
                  i++;
                  if (!last) setTimeout(go, d * 0.58);
                })();
              }
              book.addEventListener("click", flip);
              if (btn) btn.addEventListener("click", flip);
              function onMode() {
                if (!busy) render();
              }
              if (mqS.addEventListener) mqS.addEventListener("change", onMode);
              addEventListener("pageshow", function (e) {
                if (!e.persisted) return;
                clearTimeout(timer);
                busy = 0;
                var ls = book.querySelectorAll(".xzb-leaf");
                for (var i = 0; i < ls.length; i++) ls[i].remove();
                clearSeal();
                root.classList.remove("is-flipping");
                root.removeAttribute("aria-busy");
                render();
                rest();
              });
              render();
              rest();
            })();
          </script>
        </div>
      </div>
    </main>
