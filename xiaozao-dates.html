;d&quot;: &quot;十月廿二日 · 晚间&quot;, &quot;x&quot;: &quot;「南阳宋定伯，年少时，夜行逢鬼。问之，鬼言：『我是鬼。』鬼问：『汝复谁？』定伯诳之，言：『我亦鬼。』鬼问：『欲至何所？』答曰：『欲至宛市。』鬼言：『我亦欲至宛市。』遂行。数里，鬼言：『步行太迟，可共递相担，何如？』定伯曰：『大善。』鬼便先担定伯数里。鬼言：『卿太重，将非鬼也？』定…&quot;, &quot;n&quot;: &quot;第十七则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-minsu-0954.html&quot;, &quot;t&quot;: &quot;七夕乞巧&quot;, &quot;k&quot;: &quot;minsu&quot;, &quot;z&quot;: &quot;民俗&quot;, &quot;d&quot;: &quot;十月廿一日 · 上午&quot;, &quot;x&quot;: &quot;「七月七日，为牵牛织女聚会之夜。是夕，人家妇女结彩缕，穿七孔针，或以金银𨱎石为针，陈几筵酒脯瓜果于庭中，以乞巧，有喜子网于瓜上，则以为符应。」&quot;, &quot;n&quot;: &quot;第十八则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-shenhua-0954.html&quot;, &quot;t&quot;: &quot;夸父逐日&quot;, &quot;k&quot;: &quot;shenhua&quot;, &quot;z&quot;: &quot;神话&quot;, &quot;d&quot;: &quot;十月廿一日 · 上午&quot;, &quot;x&quot;: &quot;「夸父与日逐走，入日。渴，欲得饮，饮于河、渭，河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。」&quot;, &quot;n&quot;: &quot;第十九则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-zhiguai-0954.html&quot;, &quot;t&quot;: &quot;谈生&quot;, &quot;k&quot;: &quot;zhiguai&quot;, &quot;z&quot;: &quot;志怪&quot;, &quot;d&quot;: &quot;十月廿一日 · 上午&quot;, &quot;x&quot;: &quot;「汉，谈生者，年四十，无妇，常感激读诗经，夜半，有女子，年可十五六，姿颜服饰，天下无双，来就生为夫妇之言，曰：『我与人不同，勿以火照我也，三年之后，方可照耳。』与为夫妇，生一儿，已二岁，不能忍，夜，伺其寝后，盗照视之。其腰已上生肉，如人，腰已下，但有枯骨。妇觉，遂言曰：『君负我。…&quot;, &quot;n&quot;: &quot;第二十则&quot;}, {&quot;h&quot;: &quot;../xiaozao/history-2026-10-21-history-jiaxu-03.html&quot;, &quot;t&quot;: &quot;贾诩&quot;, &quot;k&quot;: &quot;history&quot;, &quot;z&quot;: &quot;历史&quot;, &quot;d&quot;: &quot;十月廿一日&quot;, &quot;x&quot;: &quot;史料凡例同前两天：正史骨架以陈寿《三国志·魏书·荀彧荀攸贾诩传》（卷十，下称「本传」）及裴松之注为主干；江陵之役一句交叉《三国志·魏书·夏侯尚传》；编年可参《资治通鉴》魏纪相应卷。文言皆附白话。演义不用。「毒士」仅注明为后人称呼／小说戏曲常用，非本传原称。第3天从文帝即位写起，经…&quot;, &quot;n&quot;: &quot;第二十一则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-minsu-1454.html&quot;, &quot;t&quot;: &quot;端午先叫浴兰节&quot;, &quot;k&quot;: &quot;minsu&quot;, &quot;z&quot;: &quot;民俗&quot;, &quot;d&quot;: &quot;十月廿一日 · 午间&quot;, &quot;x&quot;: &quot;「五月五日，谓之浴兰节。四民并蹋百草之戏，采艾以为人，悬门户上，以禳毒气。以菖蒲或镂或屑以泛酒。」&quot;, &quot;n&quot;: &quot;第二十二则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-shenhua-1454.html&quot;, &quot;t&quot;: &quot;共工怒触不周山&quot;, &quot;k&quot;: &quot;shenhua&quot;, &quot;z&quot;: &quot;神话&quot;, &quot;d&quot;: &quot;十月廿一日 · 午间&quot;, &quot;x&quot;: &quot;「昔者共工与颛顼争为帝，怒而触不周之山。天柱折，地维绝。天倾西北，故日月星辰移焉；地不满东南，故水潦尘埃归焉。」&quot;, &quot;n&quot;: &quot;第二十三则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-zhiguai-1454.html&quot;, &quot;t&quot;: &quot;西门亭&quot;, &quot;k&quot;: &quot;zhiguai&quot;, &quot;z&quot;: &quot;志怪&quot;, &quot;d&quot;: &quot;十月廿一日 · 午间&quot;, &quot;x&quot;: &quot;「后汉时，汝南汝阳西门亭，有鬼魅，宾客止宿，辄有死亡。其厉，厌者皆亡髮，失精。寻问其故，云：『先时颇已有怪物。其后，郡侍奉掾宜禄郑奇来，去亭六七里，有一端正妇人乞寄载，奇初难之，然后上车，入亭，趋至楼下。亭卒白：「楼不可上。」奇云：「吾不恐也。」时亦昏冥，遂上楼，与妇人栖宿。未明…&quot;, &quot;n&quot;: &quot;第二十四则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-minsu-2054.html&quot;, &quot;t&quot;: &quot;正月七日为人日&quot;, &quot;k&quot;: &quot;minsu&quot;, &quot;z&quot;: &quot;民俗&quot;, &quot;d&quot;: &quot;十月廿一日 · 晚间&quot;, &quot;x&quot;: &quot;「正月七日为人日，以七种菜为羹，翦彩为人，或镂金箔为人，以贴屏风，亦戴之以头鬓，亦造华胜以相遗，登高赋诗。」&quot;, &quot;n&quot;: &quot;第二十五则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-shenhua-2054.html&quot;, &quot;t&quot;: &quot;姮娥窃药奔月&quot;, &quot;k&quot;: &quot;shenhua&quot;, &quot;z&quot;: &quot;神话&quot;, &quot;d&quot;: &quot;十月廿一日 · 晚间&quot;, &quot;x&quot;: &quot;「譬若羿请不死之药於西王母，姮娥窃以奔月，怅然有丧，无以续之。」&quot;, &quot;n&quot;: &quot;第二十六则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-21-zhiguai-2054.html&quot;, &quot;t&quot;: &quot;阮瞻&quot;, &quot;k&quot;: &quot;zhiguai&quot;, &quot;z&quot;: &quot;志怪&quot;, &quot;d&quot;: &quot;十月廿一日 · 晚间&quot;, &quot;x&quot;: &quot;「阮瞻，字千里，素执无鬼论。物莫能难。每自谓，此理足以辨正幽明。忽有客通名诣瞻，寒温毕，聊谈名理。客甚有才辨，瞻与之言，良久，及鬼神之事，反覆甚苦。客遂屈，乃作色曰：『鬼神，古今圣贤所共传，君何得独言无？即仆便是鬼。』于是变为异形，须臾消灭。瞻默然，意色太恶。岁余，病卒。」&quot;, &quot;n&quot;: &quot;第二十七则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-20-minsu-0954.html&quot;, &quot;t&quot;: &quot;冬至为什么要吃赤豆粥&quot;, &quot; 日 · 午间&quot;, &quot;x&quot;: &quot;「蚩尤作兵伐黄帝，黄帝乃令应龙攻之冀州之野。应龙畜水，蚩尤请风伯雨师，纵大风雨。黄帝乃下天女曰魃，雨止，遂杀蚩尤。魃不得复上，所居不雨。叔均言之帝，后置之赤水之北。叔均乃为田祖。魃时亡之，所欲逐之者，令曰：『神北行！』先除水道，决通沟渎。」&quot;, &quot;n&quot;: &quot;第三十三则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-20-zhiguai-1454.html&quot;, &quot;t&quot;: &quot;宋大贤&quot;, &quot;k&quot;: &quot;zhiguai&quot;, &quot;z&quot;: &quot;志怪&quot;, &quot;d&quot;: &quot;十月二十日 · 午间&quot;, &quot;x&quot;: &quot;「南阳西郊有一亭，人不可止，止则有祸。邑人宋大贤以正道自处，尝宿亭楼，夜坐鼓琴，不设兵仗。至夜半时，忽有鬼来登梯，与大贤语，矃目，磋齿，形貌可恶。大贤鼓琴如故。鬼乃去。于市中取死人头来，还语大贤曰：『宁可少睡耶？』因以死人头投大贤前。大贤曰：『甚佳！我暮卧无枕，正欲得此。』鬼复去…&quot;, &quot;n&quot;: &quot;第三十四则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-20-minsu-2054.html&quot;, &quot;t&quot;: &quot;正旦为什么要爆竹&quot;, &quot;k&quot;: &quot;minsu&quot;, &quot;z&quot;: &quot;民俗&quot;, &quot;d&quot;: &quot;十月二十日 · 晚间&quot;, &quot;x&quot;: &quot;「正月一日……先于庭前爆竹，以辟山臊恶鬼。」&quot;, &quot;n&quot;: &quot;第三十五则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-20-shenhua-2054.html&quot;, &quot;t&quot;: &quot;后羿射日&quot;, &quot;k&quot;: &quot;shenhua&quot;, &quot;z&quot;: &quot;神话&quot;, &quot;d&quot;: &quot;十月二十日 · 晚间&quot;, &quot;x&quot;: &quot;「逮至尧之时，十日并出，焦禾稼，杀草木，而民无所食。猰貐、凿齿、九婴、大风、封豨、修蛇皆为民害。尧乃使羿诛凿齿于畴华之野，杀九婴于凶水之上，缴大风于青丘之泽，上射十日而下杀猰貐，断修蛇于洞庭，禽封豨于桑林。万民皆喜，置尧以为天子。」&quot;, &quot;n&quot;: &quot;第三十六则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-20-zhiguai-2054.html&quot;, &quot;t&quot;: &quot;秦巨伯&quot;, &quot;k&quot;: &quot;zhiguai&quot;, &quot;z&quot;: &quot;志怪&quot;, &quot;d&quot;: &quot;十月二十日 · 晚间&quot;, &quot;x&quot;: &quot;「瑯琊秦巨伯，年六十，尝夜行，饮酒，道经蓬山庙，忽见其两孙迎之；扶持百馀步，便捉伯颈着地，骂：「老奴！汝某日捶我，我今当杀汝。」伯思，惟某时信捶此孙。伯乃佯死，乃置伯去。伯归家，欲治两孙，两孙惊惋，叩头言：「为子孙宁可有此？恐是鬼魅，乞更试之。」伯意悟，数日，乃诈醉，行此庙间，复…&quot;, &quot;n&quot;: &quot;第三十七则&quot;}, {&quot;h&quot;: &quot;../xiaozao/entry-2026-10-19-zhiguai-0954.html&quot;, &quot;t&quot;: &quot;鬼有三技&quot;, &quot;k&quot;: &quot;zhiguai&quot;, &quot;z&quot;: &quot;志怪&quot;, &quot;d&quot;: &quot;十月十九日 · 上午&quot;, &quot;x&quot;: &quot;杭州秀才李某夜行，遇鬼作种种可怖变相。一老者教之：鬼技不过三——能迷人、能
