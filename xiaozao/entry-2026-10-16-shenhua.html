<main><div class="issue-page"><div class="issue-mast"><a class="brand-sm" href="../xiaozao.html">小灶</a><span class="meta-sm">2026 · 10 · 16 · 晚间 · 神话传说</span></div><header class="issue-head"><div class="issue-kicker">小灶 · 神话传说</div><h1 class="issue-title">夸父逐日——渴死之前，把杖化作邓林</h1></header><div class="piece-body"><p>夸父与日竞走，入日；渴欲得饮，饮于河渭；河渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。<br>
白话：他要追上太阳，跑到太阳边上；渴了喝黄河渭河，不够，再往北找大泽，没到就渴死了。扔下的手杖，长成一片桃林。</p>
<p class="sources">来源：先秦《山海经·海外北经》</p></div><footer class="folio"><a href="../xiaozao-shenhua.html">← 神话传说</a><span class="center">10月16日</span><a href="../xiaozao.html">小灶主页</a></footer></div></main><footer>日知 · Lyn每日三次知识分享</footer></body></html>
